<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Study Squad - Video Player</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 36px;
      color: #333;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .player-wrapper {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    video {
      width: 100%;
      display: block;
    }

    .quality-section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .quality-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quality-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quality-btn {
      padding: 12px 24px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      color: #333;
    }

    .quality-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .quality-btn.active {
      background: #667eea;
      border-color: #667eea;
      color: white;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .quality-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .video-info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: none;
    }

    .video-info h3 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 600;
      color: #667eea;
      min-width: 120px;
    }

    .info-value {
      color: #666;
      text-align: right;
      flex: 1;
    }

    .thumbnail {
      width: 100%;
      max-width: 300px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .controls-section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .controls-section h3 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .form-group label {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 150px;
    }

    .form-group label span {
      font-weight: 600;
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
    }

    .form-group input {
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .load-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    .load-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .load-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
      border-left: 4px solid #667eea;
      background: #f0f4ff;
      color: #004085;
      font-size: 14px;
    }

    .result.success {
      border-left-color: #28a745;
      background: #d4edda;
      color: #155724;
    }

    .result.error {
      border-left-color: #dc3545;
      background: #f8d7da;
      color: #721c24;
    }

    .result.loading {
      border-left-color: #ffc107;
      background: #fff3cd;
      color: #856404;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .form-group {
        flex-direction: column;
      }

      .quality-buttons {
        gap: 8px;
      }

      .quality-btn {
        padding: 10px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 Study Squad</h1>
      <p>Advanced Video Player with Quality Selection</p>
    </div>

    <!-- PLAYER -->
    <div class="player-wrapper">
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <!-- QUALITY SELECTION -->
    <div class="quality-section">
      <h3>🎬 Quality Options</h3>
      <div class="quality-buttons" id="qualityButtons">
        <span style="color: #999; font-size: 13px;">Load a video to see quality options</span>
      </div>
    </div>

    <!-- VIDEO INFO -->
    <div class="video-info" id="videoInfo">
      <h3>📺 Video Details</h3>
      <div class="info-row">
        <span class="info-label">Title:</span>
        <span class="info-value" id="videoTitle">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Duration:</span>
        <span class="info-value" id="videoDuration">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Quality:</span>
        <span class="info-value" id="currentQuality">-</span>
      </div>
      <img id="videoThumbnail" class="thumbnail" src="" alt="Thumbnail">
    </div>

    <!-- CONTROLS -->
    <div class="controls-section">
      <h3>🔍 Load Video</h3>
      <div class="form-group">
        <label>
          <span>Video ID</span>
          <input type="number" id="videoId" value="3755" min="1">
        </label>
        <label>
          <span>Course ID</span>
          <input type="number" id="courseId" value="8" min="1">
        </label>
      </div>
      <button class="load-btn" onclick="loadVideo()">🎬 Load & Play Video</button>
    </div>

    <!-- RESULT -->
    <div id="result" class="result"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script>
    const WORKER_URL = 'https://vibe-proxie.egomale82.workers.dev';
    let hls = null;
    let player = null;

    function showResult(message, type = 'loading') {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = message;
      resultDiv.className = `result ${type}`;
      resultDiv.style.display = 'block';
    }

    function initPlayer() {
      if (player) try { player.destroy(); } catch (e) {}
      
      player = new Plyr('#videoPlayer', {
        controls: [
          'play-large', 'play', 'progress', 'current-time', 'duration',
          'mute', 'volume', 'settings', 'pip', 'fullscreen'
        ],
        settings: ['quality', 'speed'],
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
        quality: { default: 720, options: [1080, 720, 480, 360] },
        storage: { enabled: false }
      });
    }

    function playQuality(qualityObj, button) {
      const url = qualityObj.url;
      const quality = qualityObj.quality;

      if (!url) {
        showResult(`❌ Quality URL not found`, 'error');
        return;
      }

      showResult(`⏳ Loading ${quality}...`, 'loading');
      button.disabled = true;

      try {
        const proxyUrl = `${WORKER_URL}/proxy?url=${encodeURIComponent(url)}`;

        if (url.toLowerCase().includes('m3u8')) {
          if (hls) try { hls.destroy(); } catch (e) {}
          
          if (window.Hls && Hls.isSupported()) {
            hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(proxyUrl);
            hls.attachMedia(document.getElementById('videoPlayer'));
          }
        } else {
          document.getElementById('videoPlayer').src = proxyUrl;
        }

        document.getElementById('currentQuality').textContent = quality;

        document.querySelectorAll('.quality-btn').forEach(btn => {
          btn.classList.remove('active');
          btn.disabled = false;
        });
        button.classList.add('active');

        showResult(`✅ Playing: ${quality}`, 'success');
      } catch (err) {
        showResult(`❌ Error: ${err.message}`, 'error');
        button.disabled = false;
      }
    }

    async function loadVideo() {
      const videoId = document.getElementById('videoId').value || 3755;
      const courseId = document.getElementById('courseId').value || 8;

      if (!videoId || !courseId) {
        showResult('❌ Please enter Video ID and Course ID', 'error');
        return;
      }

      showResult('⏳ Loading video...', 'loading');
      document.querySelector('.load-btn').disabled = true;

      try {
        const response = await fetch(`${WORKER_URL}/api/vibe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'video',
            video_id: parseInt(videoId),
            course_id: parseInt(courseId)
          })
        });

        const data = await response.json();

        if (!data.success) {
          showResult(`❌ Error: ${data.error || 'Unknown error'}`, 'error');
          document.querySelector('.load-btn').disabled = false;
          return;
        }

        const videoData = data.data;
        const qualities = videoData.qualities || [];

        if (qualities.length === 0) {
          showResult('❌ No quality options available', 'error');
          document.querySelector('.load-btn').disabled = false;
          return;
        }

        initPlayer();

        // Show video info
        document.getElementById('videoInfo').style.display = 'block';
        document.getElementById('videoTitle').textContent = videoData.title || 'Unknown';
        document.getElementById('videoDuration').textContent = videoData.duration || 'Unknown';
        if (videoData.thumbnail) {
          document.getElementById('videoThumbnail').src = videoData.thumbnail;
        }

        // Create quality buttons
        const btnsDiv = document.getElementById('qualityButtons');
        btnsDiv.innerHTML = '';

        qualities.forEach((q, idx) => {
          const btn = document.createElement('button');
          btn.className = `quality-btn ${idx === 0 ? 'active' : ''}`;
          btn.textContent = q.quality;
          btn.onclick = () => playQuality(q, btn);
          btnsDiv.appendChild(btn);
        });

        // Auto-play first quality
        playQuality(qualities[0], btnsDiv.querySelector('.quality-btn'));

      } catch (err) {
        showResult(`❌ Error: ${err.message}`, 'error');
      } finally {
        document.querySelector('.load-btn').disabled = false;
      }
    }
  </script>
</body>
</html>
