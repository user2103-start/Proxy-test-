<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Squad</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; }
    h1 { color: #333; margin-bottom: 30px; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
    .cf-turnstile { margin: 20px 0; display: flex; justify-content: center; }
    button { width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 16px; }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 6px; border-left: 4px solid #667eea; white-space: pre-wrap; overflow-x: auto; font-family: 'Courier New', monospace; font-size: 13px; max-height: 300px; overflow-y: auto; display: none; }
    #result.show { display: block; }
    .success { border-left-color: #28a745; background: #d4edda; }
    .error { border-left-color: #dc3545; background: #f8d7da; }
    .info { color: #155724; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Study Squad</h1>
    
    <div class="form-group">
      <label>Video ID:</label>
      <input type="number" id="videoId" value="3559" placeholder="Enter video ID">
    </div>
    
    <div class="form-group">
      <label>Course ID:</label>
      <input type="number" id="courseId" value="8" placeholder="Enter course ID">
    </div>

    <div class="cf-turnstile" data-sitekey="330e41bb475c" data-callback="onTurnstileSolve"></div>

    <button id="loadBtn" onclick="loadVideo()" disabled>Load Video</button>
    
    <div id="result"></div>
    <div class="info" id="info">👆 Solve the Turnstile challenge above, then click "Load Video"</div>
  </div>

  <script>
    let turnstileToken = null;
    const TOKEN_KEY = "trf_token";
    const EXPIRY_KEY = "trf_expiry";
    const TOKEN_DURATION = 2 * 60 * 60 * 1000; // 2 hours

    function saveToken(token) {
      const expiry = Date.now() + TOKEN_DURATION;
      sessionStorage.setItem(TOKEN_KEY, token);
      sessionStorage.setItem(EXPIRY_KEY, expiry);
      turnstileToken = token;
      console.log("✅ Token saved & will expire at:", new Date(expiry));
    }

    function getToken() {
      const token = sessionStorage.getItem(TOKEN_KEY);
      const expiry = sessionStorage.getItem(EXPIRY_KEY);
      
      if (!token || !expiry) return null;
      if (Date.now() > parseInt(expiry)) {
        console.log("⏰ Token expired!");
        clearToken();
        return null;
      }
      return token;
    }

    function clearToken() {
      sessionStorage.removeItem(TOKEN_KEY);
      sessionStorage.removeItem(EXPIRY_KEY);
      turnstileToken = null;
      document.getElementById("loadBtn").disabled = true;
      window.turnstile?.reset();
    }

    function onTurnstileSolve(token) {
      saveToken(token);
      document.getElementById("loadBtn").disabled = false;
      document.getElementById("info").textContent = "✅ Challenge solved! Now click 'Load Video'";
      console.log("Turnstile solved! Token:", token);
    }

    function updateResult(text, type = "info") {
      const resultDiv = document.getElementById("result");
      resultDiv.textContent = text;
      resultDiv.className = `show ${type}`;
    }

    async function loadVideo() {
      const token = getToken();
      if (!token) {
        updateResult("❌ Please solve the Turnstile challenge first!", "error");
        return;
      }

      document.getElementById("loadBtn").disabled = true;
      updateResult("⏳ Fetching video data...", "info");

      try {
        const videoId = document.getElementById("videoId").value || 3559;
        const courseId = document.getElementById("courseId").value || 8;

        const response = await fetch("https://va-study-squad.vercel.app/api/vibe", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Turnstile-Token": token
          },
          body: JSON.stringify({
            action: "video",
            video_id: parseInt(videoId),
            course_id: parseInt(courseId)
          })
        });

        const data = await response.json();

        if (response.status === 403) {
          clearToken();
          updateResult("❌ Token expired or invalid. Please solve the challenge again.", "error");
          return;
        }

        if (data.success) {
          updateResult(JSON.stringify(data.data, null, 2), "success");
        } else {
          updateResult(`❌ Error: ${data.error || "Unknown error"}`, "error");
        }
      } catch (err) {
        updateResult(`❌ Error: ${err.message}`, "error");
      } finally {
        document.getElementById("loadBtn").disabled = false;
      }
    }

    // Check if token already exists on page load
    window.addEventListener("load", () => {
      const token = getToken();
      if (token) {
        document.getElementById("loadBtn").disabled = false;
        document.getElementById("info").textContent = "✅ You have a valid token! Click 'Load Video'";
      }
    });
  </script>
</body>
</html>
