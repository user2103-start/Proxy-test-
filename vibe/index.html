<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Squad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; }
    h1 { color: #333; margin-bottom: 30px; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
    button { width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 16px; margin-top: 20px; }
    button:hover { opacity: 0.9; }
    #result { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 6px; border-left: 4px solid #667eea; white-space: pre-wrap; overflow-x: auto; font-family: 'Courier New', monospace; font-size: 13px; max-height: 300px; overflow-y: auto; display: none; }
    #result.show { display: block; }
    .success { border-left-color: #28a745; background: #d4edda; color: #155724; }
    .error { border-left-color: #dc3545; background: #f8d7da; color: #721c24; }
    .info { color: #004085; padding: 15px; background: #cfe2ff; border-radius: 6px; margin-top: 20px; border-left: 4px solid #0c63e4; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Study Squad</h1>
    
    <div class="info">
      ℹ️ First time? Click "Solve Challenge" button. After that, you can load videos for 2 hours!
    </div>

    <div class="form-group">
      <label>Video ID:</label>
      <input type="number" id="videoId" value="3559">
    </div>
    
    <div class="form-group">
      <label>Course ID:</label>
      <input type="number" id="courseId" value="8">
    </div>

    <button onclick="solveChallengeInIframe()">🔐 Solve Challenge (Step 1)</button>
    <button onclick="loadVideo()">▶️ Load Video (Step 2)</button>
    
    <div id="result"></div>
  </div>

  <!-- HIDDEN IFRAME - Ye studybeepro.site pe Turnstile solve karega -->
  <iframe id="challengeFrame" style="display:none; width:0; height:0; border:none;"></iframe>

  <script>
    const TOKEN_KEY = "trf_token";
    const EXPIRY_KEY = "trf_expiry";
    const TOKEN_DURATION = 2 * 60 * 60 * 1000; // 2 hours
    let challengeSolved = false;

    function saveToken(token) {
      const expiry = Date.now() + TOKEN_DURATION;
      sessionStorage.setItem(TOKEN_KEY, token);
      sessionStorage.setItem(EXPIRY_KEY, expiry);
      challengeSolved = true;
      console.log("✅ Token saved!");
    }

    function getToken() {
      const token = sessionStorage.getItem(TOKEN_KEY);
      const expiry = sessionStorage.getItem(EXPIRY_KEY);
      
      if (!token || !expiry) return null;
      if (Date.now() > parseInt(expiry)) {
        console.log("⏰ Token expired!");
        clearToken();
        return null;
      }
      return token;
    }

    function clearToken() {
      sessionStorage.removeItem(TOKEN_KEY);
      sessionStorage.removeItem(EXPIRY_KEY);
      challengeSolved = false;
    }

    function updateResult(text, type = "info") {
      const resultDiv = document.getElementById("result");
      resultDiv.textContent = text;
      resultDiv.className = `show ${type}`;
    }

    function solveChallengeInIframe() {
      if (challengeSolved) {
        updateResult("✅ Challenge already solved! You can load videos now.", "success");
        return;
      }

      updateResult("⏳ Opening challenge page in hidden window...", "info");

      return new Promise((resolve) => {
        const iframe = document.getElementById("challengeFrame");
        
        // Iframe close hone ke baad check karo
        const checkInterval = setInterval(() => {
          try {
            // Check if cookies set hain
            if (document.cookie.includes("cf_clearance")) {
              clearInterval(checkInterval);
              // Now get token from studybeepro.site via fetch
              fetchTokenFromChallengePage();
              resolve(true);
            }
          } catch (e) {
            console.log("Waiting for challenge...");
          }
        }, 1000);

        // Timeout after 30 sec
        setTimeout(() => {
          clearInterval(checkInterval);
          iframe.style.display = "none";
          updateResult("⏳ Challenge page opened. Complete the verification and come back!", "info");
        }, 30000);

        // Open challenge page in iframe
        iframe.src = `https://studybeepro.site/vib/?video_id=1&course_id=1`;
        iframe.style.display = "block";
      });
    }

    function fetchTokenFromChallengePage() {
      // Alternative: Use a hidden window approach
      const win = window.open(
        "https://studybeepro.site/vib/?video_id=1&course_id=1",
        "challenge_window",
        "width=400,height=600"
      );

      // Check every 2 sec if challenge is solved
      const checkInterval = setInterval(() => {
        try {
          // Dummy token generation - in reality, studybeepro.site sets cf_clearance cookie
          if (document.cookie.includes("cf_clearance")) {
            clearInterval(checkInterval);
            win?.close();
            
            // Generate dummy token
            const token = "simulated_token_" + Date.now();
            saveToken(token);
            updateResult("✅ Challenge solved! You can now load videos for 2 hours.", "success");
          }
        } catch (e) {
          console.log("Checking challenge status...");
        }
      }, 2000);

      // Close after 2 minutes
      setTimeout(() => {
        clearInterval(checkInterval);
        win?.close();
        updateResult("⚠️ Challenge timed out. Please try again.", "error");
      }, 120000);
    }

    async function loadVideo() {
      const token = getToken();
      
      if (!token) {
        updateResult("❌ First solve the challenge! Click 'Solve Challenge' button.", "error");
        return;
      }

      updateResult("⏳ Fetching video data...", "info");

      try {
        const videoId = document.getElementById("videoId").value || 3559;
        const courseId = document.getElementById("courseId").value || 8;

        const response = await fetch("https://va-study-squad.vercel.app/api/vibe", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Turnstile-Token": token
          },
          body: JSON.stringify({
            action: "video",
            video_id: parseInt(videoId),
            course_id: parseInt(courseId)
          })
        });

        const data = await response.json();

        if (response.status === 403) {
          clearToken();
          updateResult("❌ Token expired. Solve the challenge again.", "error");
          return;
        }

        if (data.success) {
          updateResult(JSON.stringify(data.data, null, 2), "success");
        } else {
          updateResult(`❌ Error: ${data.error}`, "error");
        }
      } catch (err) {
        updateResult(`❌ Error: ${err.message}`, "error");
      }
    }

    // Check on page load
    window.addEventListener("load", () => {
      const token = getToken();
      if (token) {
        updateResult("✅ You have a valid token! Load videos anytime.", "success");
        challengeSolved = true;
      }
    });
  </script>
</body>
</html>
